name: Build Docker images

on:
  push:
    branches: [ "master" ]
    paths:
      - "dnsproxy-entrypoint.sh"
      - "dnsproxy.Dockerfile"
      - "sni-entrypoint.sh"
      - "sni.Dockerfile"
      - "xray.Dockerfile"
      - ".github/workflows/build-images.yml"

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}


jobs:
  dnsproxy-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push DNSProxy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dnsproxy.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/dnsproxy:latest
            docker.io/shervinamd/dnsproxy:latest

  sni-proxy-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push SNI Proxy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: sni.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/sni-proxy:latest
            docker.io/shervinamd/sni-proxy:latest

  xray-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get the latest Xray version
        id: get-xray-version
        env:
          OWNER: "XTLS"
          REPO: "Xray-core"
        run: |
          LATEST_RELEASE="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/latest" |
              jq -r '.tag_name'
          )"
          [[ -n "$LATEST_RELEASE" ]] || (echo "LATEST_RELEASE variable is empty" && exit 1)
          echo "XRAY_LATEST_RELEASE=$LATEST_RELEASE" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Xray image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: xray.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/xray:latest
            docker.io/shervinamd/xray:latest
          build-args: |
            XRAY_VERSION=${{ env.XRAY_LATEST_RELEASE }}